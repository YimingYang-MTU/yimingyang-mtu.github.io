<div style="margin-bottom: 14px; line-height: 1.35;">
  <div style="font-size: 1.05rem; font-weight: 600;">
    <a href="{{ post.paperurl | default: post.url }}">{{ post.title }}</a>
  </div>
  <div style="font-size: 0.92rem; color: #333; margin-top: 2px;">
    {% if post.authors %}{{ post.authors }}{% else %}Yiming Yang, Jeremy P. Bos{% endif %}
  </div>
  <div style="font-size: 0.88rem; color: #666; font-style: italic; margin-top: 1px;">
    {% if post.venue %}{{ post.venue }}, {% endif %}{{ post.date | date: "%Y" }}
  </div>
</div>
